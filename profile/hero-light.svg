<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img"><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e6e6"/></pattern></defs><rect width="100%" height="100%" rx="16" fill="#f5f5f5"/><rect width="100%" height="100%" rx="16" fill="url(#dots)"/><rect x="56" y="40" width="1088" height="360" rx="14" fill="#ffffff" stroke="#e2e2e2"/><line x1="56" y1="80" x2="1144" y2="80" stroke="#e2e2e2"/><circle cx="84" cy="60" r="6" fill="none" stroke="#6b6b6b"/><circle cx="104" cy="60" r="6" fill="none" stroke="#6b6b6b"/><circle cx="124" cy="60" r="6" fill="none" stroke="#6b6b6b"/><text x="600" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b6b6b">~/201tech</text><g transform="translate(104 108) scale(0.64)"><rect width="100" height="100" rx="18" fill="#000000" stroke="#e2e2e2" stroke-width="2"/><g transform="translate(6 6) scale(0.88)"><g style="isolation:isolate"><rect x="33.75" y="11.75" width="57" height="46.5" rx="7" fill="none" stroke="#ffffff" stroke-width="7.5" style="mix-blend-mode:difference"/><rect x="23" y="15" width="57.5" height="54" rx="10" fill="#ffffff" style="mix-blend-mode:difference"/></g><rect x="3.25" y="68.25" width="20.5" height="15.5" rx="5" fill="none" stroke="#ffffff" stroke-width="2.5"/></g></g><text x="190" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#000000" letter-spacing="-1">201tech</text><text x="192" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6b6b6b">we build software that people actually use</text><text x="104" y="236" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#000000"><tspan fill="#6b6b6b">$ </tspan>whoami</text><text x="104" y="266" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#6b6b6b">an independent product studio. we design, build and run software.</text><text x="104" y="296" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#000000"><tspan fill="#6b6b6b">$ </tspan>while (product.alive) {</text><text x="104" y="326" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#000000">  discover(); design(); build(); ship();</text><text x="104" y="356" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#000000">}</text><rect x="104" y="368" width="11" height="22" fill="#000000"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></rect></svg>