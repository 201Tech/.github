" font-size="13" font-weight="400" fill="#8a8a8a">readable over clever, config over hardcoded, few deps</text><rect x="608.0" y="948.0" width="536.0" height="70.0" rx="12" fill="#111111" stroke="#262626"/><text x="632.0" y="978.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f5f5f5">secure from the first commit</text><text x="632.0" y="1000.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8a8a">privacy and security by design, not a final checklist</text><rect x="56.0" y="1034.0" width="536.0" height="70.0" rx="12" fill="#111111" stroke="#262626"/><text x="80.0" y="1064.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f5f5f5">ship small, ship often</text><text x="80.0" y="1086.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8a8a">short loops with real users beat long plans</text><rect x="608.0" y="1034.0" width="536.0" height="70.0" rx="12" fill="#111111" stroke="#262626"/><text x="632.0" y="1064.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#f5f5f5">yours from day one</text><text x="632.0" y="1086.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#8a8a8a">code, infra and docs belong to whoever owns the product</text><text x="56.0" y="1168.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#f5f5f5"><tspan fill="#8a8a8a">&gt;</tspan> sta