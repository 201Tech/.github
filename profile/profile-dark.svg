" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#f5f5f5"><tspan fill="#8a8a8a">$ </tspan>whoami</text><text x="104.0" y="266.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#8a8a8a">an independent product studio. we design, build and run software.</text><text x="104.0" y="296.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#f5f5f5"><tspan fill="#8a8a8a">$ </tspan>while (product.alive) {</text><text x="104.0" y="326.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#f5f5f5">  discover(); design(); build(); ship();</text><text x="104.0" y="356.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#f5f5f5">}</text><rect x="104" y="368" width="11" height="22" fill="#f5f5f5"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></rect><text x="56.0" y="474.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#f5f5f5"><tspan fill="#8a8a8a">&gt;</tspan> what we build</text><rect x="56.0" y="498.0" width="352.0" height="56.0" rx="12" fill="#111111" stroke="#262626"/><text x="80.0" y="533.0" text-anchor="start" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f5f5f5"><tspan fill="#8a8a8a">~ </tspan>mobile apps</text><rect x="424.0" y="498.0" width="352.0" height="56.0" rx="12" fill="#111111" stroke="#262626"/><text x="448.0" y="533.0" text-anchor="start" xml:space="pres